version: "3.8"

services:
  # ── MySQL Database ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: campuscarry_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-yourpassword}
      MYSQL_DATABASE: ${DB_NAME:-campuscarry}
      MYSQL_USER: ${DB_USER:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-yourpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-yourpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - campuscarry_net
    # For ARM Macs / Apple Silicon, use platform override if needed:
    # platform: linux/amd64

  # ── Backend (Node.js + Express + Socket.io) ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuscarry_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-yourpassword}
      DB_NAME: ${DB_NAME:-campuscarry}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Razorpay
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_TEST_MODE: ${RAZORPAY_TEST_MODE:-true}
      # FCM
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    command: ["npm", "run", "dev"]
    networks:
      - campuscarry_net

  # ── Frontend (Vite dev server for development) ──────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: campuscarry_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    networks:
      - campuscarry_net

  # ── Frontend production (nginx) — uncomment to use instead of dev server ──
  # frontend_prod:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: campuscarry_frontend_prod
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   ports:
  #     - "80:80"
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:4000
  #   networks:
  #     - campuscarry_net

volumes:
  db_data:
  backend_logs:

networks:
  campuscarry_net:
    driver: bridge
